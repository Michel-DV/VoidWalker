<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">VoidWalker synthetic lab terminal demo</title>
  <desc id="desc">A terminal-style visualization showing IoT discovery, risky services, vulnerability candidates, and potential compromise indicators.</desc>
  <rect width="1280" height="760" rx="24" fill="#0b0f0d"/>
  <rect x="28" y="28" width="1224" height="704" rx="18" fill="#111814" stroke="#263a30" stroke-width="2"/>
  <circle cx="62" cy="58" r="8" fill="#ff5f57"/><circle cx="88" cy="58" r="8" fill="#febc2e"/><circle cx="114" cy="58" r="8" fill="#28c840"/>
  <text x="640" y="64" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8ca398">VoidWalker v2.1 — synthetic lab demo</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
    <text x="58" y="112" fill="#39ff88">$ python VoidWalker.py --network 192.168.50.0/24</text>
    <text x="58" y="148" fill="#d7e4dc">VoidWalker v2.1.0 - IoT discovery, exposure and compromise triage</text>
    <text x="58" y="180" fill="#8ca398">Scope: 192.168.50.0/24</text>
    <text x="58" y="212" fill="#8ca398">Hosts: 254 | Open-service findings: 6 | Discovery records: 5 | Indicators: 3</text>

    <text x="58" y="260" fill="#39ff88" font-weight="700">DEVICE INTELLIGENCE</text>
    <text x="78" y="294" fill="#d7e4dc">192.168.50.22  → Hikvision / DS-2CD / camera</text>
    <text x="98" y="324" fill="#8ca398">discovery: mdns, ssdp  ·  services: RTSP, HTTP/vendor management</text>
    <text x="78" y="356" fill="#d7e4dc">192.168.50.34  → Espressif / lab-iot-01 / embedded device</text>
    <text x="98" y="386" fill="#8ca398">discovery: mdns  ·  services: Telnet, ADB/debug</text>

    <text x="58" y="434" fill="#39ff88" font-weight="700">TCP EXPOSURE FINDINGS</text>
    <text x="78" y="468" fill="#ffcf5a">[MEDIUM] 192.168.50.22:554   RTSP</text>
    <text x="78" y="498" fill="#ff7b72">[HIGH]   192.168.50.34:23    Telnet</text>
    <text x="78" y="528" fill="#ff7b72">[HIGH]   192.168.50.34:5555  ADB / debug service</text>

    <text x="58" y="576" fill="#39ff88" font-weight="700">VULNERABILITY / COMPROMISE TRIAGE</text>
    <text x="78" y="610" fill="#ff5f57">[CRITICAL] 192.168.50.34  compromise-indicator / confidence=medium</text>
    <text x="98" y="640" fill="#d7e4dc">Mirai family string observed in device/service evidence</text>
    <text x="78" y="672" fill="#ff7b72">[HIGH]     192.168.50.34  compromise-suspicion / confidence=low</text>
    <text x="98" y="702" fill="#d7e4dc">Multiple botnet-targeted management surfaces are reachable</text>
  </g>
  <text x="1218" y="714" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#5f7569">synthetic data · indicators are investigation leads, not infection verdicts</text>
</svg>