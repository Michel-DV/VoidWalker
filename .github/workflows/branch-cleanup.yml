name: One-shot branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Delete obsolete development branches
        shell: bash
        run: |
          branches=("feat/v2-iot-auditor" "feat/v2.1-discovery-intel" "tmp/portfolio-maintenance-delete-me")
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "already absent: $branch"
            fi
          done
