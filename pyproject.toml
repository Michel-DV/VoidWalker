[project]
name = "voidwalker"
version = "2.1.0"
description = "Local IoT discovery, exposure, vulnerability-candidate, and compromise-triage auditor"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
